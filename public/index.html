<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Medical Translator</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 50px auto; padding: 0 20px; background: #f7f7f8; }
  h1 { text-align: center; font-size: 22px; margin-bottom: 24px; }
  .lang-bar { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px; }
  .lang-bar select { flex: 1; max-width: 300px; padding: 10px 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; background: #fff; }
  .swap-btn { border: none; background: #eee; border-radius: 50%; width: 34px; height: 34px; cursor: pointer; font-size: 16px; flex-shrink: 0; }
  .swap-btn:hover { background: #ddd; }
  .boxes { display: flex; gap: 16px; }
  .box { flex: 1; }
  textarea { width: 100%; height: 180px; padding: 14px; font-size: 16px; border-radius: 12px; border: 1px solid #ddd; resize: none; box-sizing: border-box; font-family: inherit; }
  textarea[disabled] { background: #fff; color: #111; }
  .preview { font-size: 13px; color: #666; min-height: 18px; margin-top: 6px; padding-left: 4px; }
  .warning { margin-top: 8px; font-size: 13px; color: #a15c00; background: #fff4e0; padding: 8px 12px; border-radius: 8px; }
  .rtl { direction: rtl; text-align: right; }
  .ltr { direction: ltr; text-align: left; }

  #fb { margin-top: 14px; }
  #fb button { padding: 6px 12px; margin-right: 6px; border: 1px solid #ccc; border-radius: 8px; background: #fff; cursor: pointer; }
  #fb button:hover { background: #eee; }
  #fb input[type=text], #fb input:not([type]) { padding: 8px; border: 1px solid #ccc; border-radius: 8px; margin: 6px 6px 0 0; }
  #fbStatus { font-size: 13px; color: #2a7a2a; }
</style>
</head>
<body>

<h1>🩺 Medical Translator</h1>

<div class="lang-bar">
  <select id="fromLang">
    <option value="English">English</option>
    <option value="Urdu">Urdu</option>
  </select>
  <button class="swap-btn" id="swapBtn" title="Swap languages">⇄</button>
  <select id="toLang">
    <option value="Urdu">Urdu</option>
    <option value="English">English</option>
  </select>
</div>

<div class="boxes">
  <div class="box">
    <textarea id="input" placeholder="Type here..."></textarea>
    <div class="preview" id="urduPreview"></div>
  </div>
  <div class="box">
    <textarea id="output" disabled placeholder="Translation"></textarea>
    <div class="warning" id="warning" style="display:none;"></div>
  </div>
</div>

<div id="fb" style="display:none;">
  <button onclick="sendFb('up')">👍</button>
  <button onclick="sendFb('down')">👎</button>
  <button id="editBtn">✏️ Edit translation</button>
  <div id="editArea" style="display:none;">
    <input id="fbEn" placeholder="Term (English)">
    <input id="fbUr" placeholder="Urdu">
    <label><input type="checkbox" id="fbKeep"> keep in English</label>
    <button onclick="sendFb()">Save correction</button>
  </div>
  <span id="fbStatus"></span>
  <a href="/dashboard.html" style="float:right;font-size:13px;">Dashboard</a>
</div>

<script>
  const input = document.getElementById("input");
  const output = document.getElementById("output");
  const urduPreview = document.getElementById("urduPreview");
  const warningBox = document.getElementById("warning");
  const fromLangSel = document.getElementById("fromLang");
  const toLangSel = document.getElementById("toLang");
  const swapBtn = document.getElementById("swapBtn");

  const fb = document.getElementById("fb");
  const editArea = document.getElementById("editArea");
  const fbStatus = document.getElementById("fbStatus");

  let translationTimer;
  let lastId = null;
  let reqCounter = 0;

  input.addEventListener("input", () => {
    clearTimeout(translationTimer);
    translationTimer = setTimeout(runTranslate, 1500);
  });

  fromLangSel.addEventListener("change", () => {
    if (fromLangSel.value === toLangSel.value) {
      toLangSel.value = fromLangSel.value === "English" ? "Urdu" : "English";
    }
    runTranslate();
  });
  toLangSel.addEventListener("change", () => {
    if (toLangSel.value === fromLangSel.value) {
      fromLangSel.value = toLangSel.value === "English" ? "Urdu" : "English";
    }
    runTranslate();
  });
  swapBtn.addEventListener("click", () => {
    const tmp = fromLangSel.value;
    fromLangSel.value = toLangSel.value;
    toLangSel.value = tmp;
    input.value = output.value;
    runTranslate();
  });

  document.getElementById("editBtn").addEventListener("click", () => {
    output.disabled = false;
    editArea.style.display = "block";
    output.focus();
  });

  async function sendFb(rating) {
    if (!lastId) return;
    const en = document.getElementById("fbEn").value.trim();
    const ur = document.getElementById("fbUr").value.trim();

    try {
      await fetch("/api/feedback", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          translationId: lastId,
          rating,
          correctedTranslation: output.value,
          glossaryEntry: en && ur
            ? { en, ur, keepEnglish: document.getElementById("fbKeep").checked }
            : null,
        }),
      });
      fbStatus.textContent = " Saved ✓";
      output.disabled = true;
      editArea.style.display = "none";
      document.getElementById("fbEn").value = "";
      document.getElementById("fbUr").value = "";
      document.getElementById("fbKeep").checked = false;
    } catch (e) {
      fbStatus.textContent = " Could not save feedback";
    }
  }

  async function runTranslate() {
  const text = input.value.trim();
  if (!text) {
    output.value = "";
    urduPreview.textContent = "";
    warningBox.style.display = "none";
    fb.style.display = "none";
    return;
  }

  const myReq = ++reqCounter;
  warningBox.style.display = "none";

  try {
    const res = await fetch("/translate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        text,
        sourceLang: fromLangSel.value,
        targetLang: toLangSel.value,
        generateUrduPreview: fromLangSel.value === "Urdu",
      }),
    });

    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || "Translation request failed.");

    if (myReq !== reqCounter) return; // ignore outdated responses

    lastId = data.translationId;
    fb.style.display = "block";
    fbStatus.textContent = "";
    editArea.style.display = "none";
    output.disabled = true;

    output.value = data.translation || "";
    output.className = data.textDirection === "rtl" ? "rtl" : "ltr";

    if (fromLangSel.value === "Urdu" && data.urduPreview && data.detectedLanguage === "roman_urdu") {
      urduPreview.textContent = `Detected: ${data.urduPreview}`;
    } else {
      urduPreview.textContent = "";
    }

    if (!data.safetyPassed) {
      warningBox.style.display = "block";
      warningBox.textContent = "⚠️ Please double-check this translation.";
    }
  } catch (error) {
    if (myReq !== reqCounter) return;
    output.value = "";
    warningBox.style.display = "block";
    warningBox.textContent = `Translation failed: ${error.message} Check the server terminal for details.`;
  }
}
</script>

</body>
</html>
